// Contract between LuminaBox.Api (gRPC client) and LuminaBox.AiService (gRPC server).
// LuminaBox.Infrastructure compiles this file with GrpcServices="Client",
// LuminaBox.AiService with GrpcServices="Server". Keep field numbers stable: never reuse a removed number.
syntax = "proto3";

package luminabox.ai.v1;

option csharp_namespace = "LuminaBox.Contracts.AiChat";

service AiChat {
  // One chat turn. The server streams thinking / content tokens, tool activity, then exactly one
  // terminal event (done or error). Cancelling the call stops generation on the LLM side.
  rpc StreamChat (ChatRequest) returns (stream ChatEvent);
}

message ChatRequest {
  string turn_id = 1;                 // generated by the BE, echoed on every event
  string user_id = 2;                 // authenticated user (tools use it to scope data)
  repeated ChatMessage messages = 3;  // conversation history, oldest first, without system prompt
  bool enable_thinking = 4;           // ask the model to stream its reasoning
  string client_route = 5;            // page the user is on, e.g. "/" or "/account/profile"
  string user_role = 6;               // User | Organization | Manager — filters what tools may offer
}

message ChatMessage {
  ChatRole role = 1;
  string content = 2;
}

enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;
  CHAT_ROLE_USER = 1;
  CHAT_ROLE_ASSISTANT = 2;
}

message ChatEvent {
  string turn_id = 1;
  int32 seq = 2;  // strictly increasing per turn, starts at 1

  oneof payload {
    TextDelta thinking = 10;         // reasoning token(s) — show, never store as history
    TextDelta content = 11;          // answer token(s)
    ToolStarted tool_started = 12;
    ToolFinished tool_finished = 13;
    Done done = 14;                  // terminal
    Error error = 15;                // terminal
    RoundReset round_reset = 16;     // content streamed since the last reset was NOT the final answer
    UiAction ui_action = 17;         // something the FE should do on screen
  }
}

// An action the FE performs itself. The model never names routes or elements: it only picks a guide id
// from a fixed catalogue, and the FE maps that id to a page and a button.
message UiAction {
  string type = 1;      // guide
  string guide_id = 2;  // e.g. add_address
}

// The content of the round that just ended was a preamble ("để mình xem…") before a tool call, or a stall.
// The UI should move it out of the answer bubble (e.g. into the thinking block); the real answer follows.
message RoundReset {
  string reason = 1;  // tool_call | stall
}

message TextDelta {
  string text = 1;
}

message ToolStarted {
  string call_id = 1;
  string name = 2;
  string display_text = 3;  // friendly line for the UI, e.g. "Đang tra cứu sản phẩm…"
}

message ToolFinished {
  string call_id = 1;
  string name = 2;
  bool success = 3;
}

message Done {
  string finish_reason = 1;  // stop | length | max_rounds | stall_fallback
  int32 prompt_tokens = 2;
  int32 completion_tokens = 3;
}

message Error {
  string code = 1;     // llm_unavailable | llm_error | internal
  string message = 2;
}
